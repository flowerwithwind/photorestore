# PhotoRestore 前端：静态托管（SPA fallback）+ /api 反代到 backend（含 SSE）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查路径（docker-compose healthcheck 使用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api 反代到后端 uvicorn（8030）
    # SSE：关闭代理缓冲 + X-Accel-Buffering no，放宽读写超时
    location /api/ {
        proxy_pass http://backend:8030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;
        proxy_connect_timeout 5s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # SPA fallback：未知路径回 index.html（React Router）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
